[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --strict-config
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/test-results
    --html=reports/report.html
    --self-contained-html
    --reruns 2
    --reruns-delay 3

# Every test here talks to a site we do not own, so a retry is not a smell --
# it is the correct response to somebody else's 502. Read docs in the README
# under "Why retries are on by default" before copying this into a repo that
# tests your OWN application, where retries hide real bugs.

markers =
    smoke: the handful of checks most likely to stay stable. Runs on every PR.
    ui: browser-driven.
    api: pure HTTP, no browser.
    slow: takes more than ~5s.
    wip: work in progress -- excluded from CI, use while drafting an example.

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::UserWarning
