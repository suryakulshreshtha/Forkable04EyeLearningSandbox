[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reports", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "PT", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pages", "utils"]
