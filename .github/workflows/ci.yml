# =============================================================================
# THE WHOLE PIPELINE, ON ONE SCREEN.
#
#   lint  ->  test  ->  (artifact)
#
# The big sibling repo shards across 16 jobs. This one deliberately does not:
# the point here is that you can read every CI/CD concept in a single file.
# Each block is annotated with WHY, not just what.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]      # a typo fix should not cost minutes
  pull_request:
    branches: [main]
  workflow_dispatch:                        # adds a "Run workflow" button
  schedule:
    - cron: "0 3 * * 1"                     # Mondays 03:00 UTC (cron is UTC)

# Least privilege. The token can write to your repo by default; we only read.
permissions:
  contents: read

# Push three commits in a minute and only the newest needs to run. Usually the
# single biggest saving available in Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Public-internet round trips from a shared runner are slow and jittery.
  TIMEOUT_MS: "30000"
  # A site being down should SKIP, not fail. See conftest.py for the reasoning.
  SKIP_IF_SITE_DOWN: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINT -- seconds, not minutes, and everything else depends on it.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and collect
    runs-on: ubuntu-latest
    timeout-minutes: 10          # without this, a hang burns six hours of quota
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                          # keyed on the requirements files
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # --output-format=github emits ::error annotations, so problems appear
      # inline on the PR's Files-changed tab instead of buried in a log.
      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

      # Imports every test module without running it. Catches an import error,
      # a bad fixture or an unregistered marker in ~5s instead of 6 minutes in.
      - name: Collect tests
        run: pytest --collect-only -q

  # ---------------------------------------------------------------------------
  # 2. TEST -- browsers, cached, with artifacts on failure.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.browser }})
    needs: lint                 # fail fast, and fail cheap
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A webkit failure must not cancel the chromium job. You want the whole
      # picture from one run, not a game of whack-a-mole.
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      # Browser binaries are ~400MB and 60-90s to download. The cache key
      # includes the resolved Playwright version, so upgrading the client
      # always fetches matching binaries -- a stale-browser/new-client mismatch
      # is a horrible bug to diagnose.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install browser
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      # Even on a cache HIT the OS-level shared libraries must be installed --
      # they live in /usr/lib, outside the cached directory. Forgetting this is
      # the most common broken-cache bug in Playwright CI.
      - name: Install OS dependencies
        if: steps.cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps ${{ matrix.browser }}

      # Pull requests run the stable subset so reviews stay fast; pushes to
      # main and the weekly schedule run everything. Two-tier suites are how
      # you keep a gate people do not resent.
      - name: Run tests
        run: |
          MARKERS="not wip"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MARKERS="smoke and $MARKERS"
          fi
          pytest -m "$MARKERS" --browser ${{ matrix.browser }} -v

      # if: always() is the most important line here. Steps are skipped once a
      # previous one fails -- which is exactly when you need the trace.
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      # $GITHUB_STEP_SUMMARY renders markdown on the run's landing page --
      # much friendlier than asking people to read logs.
      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.browser }}"
            echo ""
            echo "Event: \`${{ github.event_name }}\`"
            echo ""
            echo "Skipped tests are sites being unreachable, not failures."
            echo "Download the \`report-${{ matrix.browser }}\` artifact and run"
            echo "\`playwright show-trace trace.zip\` to replay any failure."
          } >> "$GITHUB_STEP_SUMMARY"
