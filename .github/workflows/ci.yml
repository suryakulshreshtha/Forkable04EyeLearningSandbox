# =============================================================================
# THE GATE: what you control, on one screen.
#
#   lint  ->  api tests
#
# The browser suite drives public practice sites we do not own. From a shared
# runner they are sometimes slow, sometimes unreachable and sometimes different,
# so it lives in live-sites.yml with its own badge. A merge gate that goes red
# because somebody else's website had a bad hour teaches the team to ignore red.
# Each block is annotated with WHY, not just what.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]      # a typo fix should not cost minutes
  pull_request:
    branches: [main]
  workflow_dispatch:                        # adds a "Run workflow" button

# Least privilege. The token can write to your repo by default; we only read.
permissions:
  contents: read

# Push three commits in a minute and only the newest needs to run. Usually the
# single biggest saving available in Actions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # A site being down should SKIP, not fail. See conftest.py for the reasoning.
  SKIP_IF_SITE_DOWN: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINT -- seconds, not minutes, and everything else depends on it.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10          # without this, a hang burns six hours of quota
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip                          # keyed on the requirements files
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # --output-format=github emits ::error annotations, so problems appear
      # inline on the PR's Files-changed tab instead of buried in a log.
      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

      # Imports every test module without running it. Catches an import error,
      # a bad fixture or an unregistered marker in ~5s instead of 6 minutes in.
      - name: Collect tests
        run: pytest --collect-only -q

  # ---------------------------------------------------------------------------
  # 2. API TESTS -- no browser, so no 400MB download and no flaky page loads.
  # ---------------------------------------------------------------------------
  api:
    name: API tests
    needs: lint                 # fail fast, and fail cheap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      # Plain HTTP against JSONPlaceholder. If that host is unreachable these
      # skip (see conftest.py), so somebody else's bad hour shows up as a skip
      # in the report, not as a red build.
      - name: Run API tests
        run: pytest -m "api and not wip" -v

      # if: always() is the most important line here. Steps are skipped once a
      # previous one fails -- which is exactly when you need the report.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-api
          path: reports/
          retention-days: 14
          if-no-files-found: warn
